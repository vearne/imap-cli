name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Run tests
      run: go test ./... -race -count=1

    - name: Build binaries
      run: |
        LDFLAGS="-s -w"
        GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o imap-cli-linux-amd64 ./
        GOOS=linux   GOARCH=arm64 go build -ldflags "$LDFLAGS" -o imap-cli-linux-arm64 ./
        GOOS=darwin  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o imap-cli-darwin-amd64 ./
        GOOS=darwin  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o imap-cli-darwin-arm64 ./
        GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o imap-cli-windows-amd64.exe ./

    - name: Create checksums
      run: sha256sum imap-cli-* > checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          imap-cli-*
          checksums.txt
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
